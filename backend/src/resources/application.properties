# Write logs to a file
logging.file.name=logs/backend.log

# Default log level for the application
logging.level.root=DEBUG

# Set DEBUG level for application code
logging.level.com.example.backend=DEBUG

# Set different levels for specific frameworks
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR

# Maximum size of an individual log file
logging.logback.rollingpolicy.max-file-size=20MB

# Keep archived logs for 30 days
logging.logback.rollingpolicy.max-history=30

# Limit total size of archived logs
logging.logback.rollingpolicy.total-size-cap=1GB
